name: Dependency Review

# Manual trigger only (workflow_dispatch) — Charlie's policy: all CI runs locally, not on GitHub.
# Public repo: Actions minutes are free, so this is policy consistency, not cost savings.
on:
  workflow_dispatch:
    inputs:
      base-ref:
        description: 'Base git ref to compare against'
        required: true
        default: master
      head-ref:
        description: 'Head git ref to review'
        required: true
        default: master

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ github.event.inputs.base-ref }}
          head-ref: ${{ github.event.inputs.head-ref }}
